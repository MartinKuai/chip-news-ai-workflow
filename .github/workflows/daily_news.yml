name: Daily Chip News V2

on:
  schedule:
    # UTC 22:55 = Beijing time 06:55
    - cron: "55 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-chip-news-v2
  cancel-in-progress: false

jobs:
  run-micro-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Researcher -> Writer -> Reviewer workflow
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTICLES_PER_FEED: "2"
          MAX_REVISIONS: "2"
        run: python main.py
