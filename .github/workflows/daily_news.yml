name: Daily Chip News

on:
  schedule:
    # UTC 22:55 = Beijing time 06:55
    - cron: "55 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chip-news-ai-workflow
  cancel-in-progress: false

jobs:
  run-micro-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Researcher -> Writer -> Reviewer workflow
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEARCHER_MODEL: ${{ vars.RESEARCHER_MODEL }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL }}
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTICLES_PER_FEED: "2"
          MAX_REVISIONS: "2"
        run: python main.py
