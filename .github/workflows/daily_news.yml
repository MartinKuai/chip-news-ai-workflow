name: Daily Chip News

on:
  schedule:
    # GitHub Actions cron is UTC: 22:55 UTC = 06:55 Asia/Shanghai (UTC+08:00) next day.
    - cron: "55 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chip-news-ai-workflow
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Longer than RUN_BUDGET_SECONDS (2100s) so a bounded run always finishes its
    # summary and operational alert instead of being cancelled.
    timeout-minutes: 60
    # Keep workflow log timestamps aligned with the Beijing-time schedule.
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the news production pipeline
        env:
          # Credentials come from Repository Secrets, models from Variables.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEARCHER_MODEL: ${{ vars.RESEARCHER_MODEL }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL }}
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTICLES_PER_FEED: "2"
          MAX_CANDIDATES_PER_RUN: "6"
          MAX_REVISIONS: "1"
          RUN_SUMMARY_PATH: run-summary.json
          # Optional tuning lives in the code defaults; set them here only when a
          # change is needed:
          # SOURCE_FEEDS=https://a.example/feed,https://b.example/feed
          # MAX_CANDIDATE_AGE_HOURS=72 | ARTICLE_CONTENT_CHARS=12000
          # RESEARCHER_THINKING_LEVEL=low | WRITER_THINKING_LEVEL=low
          # REVIEWER_THINKING_LEVEL=low
          # RESEARCHER_MAX_OUTPUT_TOKENS=3072 | WRITER_MAX_OUTPUT_TOKENS=2560
          # REVIEWER_MAX_OUTPUT_TOKENS=1024
          # GEMINI_TIMEOUT_SECONDS=180 | GEMINI_MAX_ATTEMPTS=5
          # GEMINI_CALL_BUDGET_SECONDS=240 | GEMINI_STRUCTURED_OUTPUT=1
          # BREAKER_WINDOW=5 | BREAKER_THRESHOLD=3 | RUN_BUDGET_SECONDS=2100
          # PUBLISH_ENABLED=1 | TELEGRAM_TIMEOUT_SECONDS=15
        run: python main.py

      - name: Upload run summary
        # Always upload so a failed run still leaves its business record behind.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-summary
          path: run-summary.json
          retention-days: 30
          if-no-files-found: warn
