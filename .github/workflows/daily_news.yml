name: Daily Chip News

on:
  schedule:
    # GitHub Actions cron is UTC: 16:05 UTC = 00:05 Asia/Shanghai (UTC+08:00) next day.
    - cron: "5 16 * * *"
  workflow_dispatch:

# The built-in token stays read-only: it reads the quota ledger artifact and
# the scheduled-run history for stats.json. Writes to the website repo use the
# separate SITE_REPO_TOKEN secret (fine-grained, Contents read/write on
# MartinKuai/martinkuai only).
permissions:
  contents: read
  actions: read

concurrency:
  group: chip-news-ai-workflow
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Longer than RUN_BUDGET_SECONDS (2100s) so a bounded run always finishes its
    # summary and operational alert instead of being cancelled.
    timeout-minutes: 60
    # Keep workflow log timestamps aligned with the Beijing-time schedule.
    env:
      TZ: Asia/Shanghai
      GEMINI_MIN_INTERVAL_SECONDS: "15"
      GEMINI_DAILY_REQUEST_LIMIT: "18"
      GEMINI_QUOTA_LEDGER_PATH: gemini-quota-ledger.json
      GEMINI_QUOTA_LEDGER_REQUIRED: "1"
      RESEARCHER_MODEL: ${{ vars.RESEARCHER_MODEL }}
      WRITER_MODEL: ${{ vars.WRITER_MODEL }}
      REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}
      GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Gemini quota ledger
        id: quota-restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_quota_ledger.py

      - name: Run the news production pipeline
        # Restore succeeds only with auditable state; an API/artifact failure
        # prevents generation instead of silently resetting the daily budget.
        env:
          # Credentials come from Repository Secrets, models from Variables.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Website publishing (default): one commit per run to the site repo
          # with data/news/YYYY-MM-DD.json (when an item passed review) and
          # data/news/stats.json. SITE_PUBLISH_MODE: github | local | off.
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          SITE_PUBLISH_MODE: ${{ vars.SITE_PUBLISH_MODE || 'github' }}
          SITE_REPO: ${{ vars.SITE_REPO || 'MartinKuai/martinkuai' }}
          SITE_REPO_BRANCH: ${{ vars.SITE_REPO_BRANCH || 'main' }}
          # Read-only built-in token: scheduled-run history for stats.json.
          GITHUB_TOKEN: ${{ github.token }}
          # Telegram is off by default; set the Variable PUBLISH_TELEGRAM=1 to
          # send every approved item (and run alerts) to Telegram again.
          PUBLISH_TELEGRAM: ${{ vars.PUBLISH_TELEGRAM || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTICLES_PER_FEED: "2"
          MAX_CANDIDATES_PER_RUN: "6"
          MAX_REVISIONS: "1"
          RUN_SUMMARY_PATH: run-summary.json
          # Optional tuning lives in the code defaults; set them here only when a
          # change is needed:
          # SOURCE_FEEDS=https://a.example/feed,https://b.example/feed
          # MAX_CANDIDATE_AGE_HOURS=72 | ARTICLE_CONTENT_CHARS=12000
          # RESEARCHER_THINKING_LEVEL=low | WRITER_THINKING_LEVEL=low
          # REVIEWER_THINKING_LEVEL=low
          # RESEARCHER_MAX_OUTPUT_TOKENS=3072 | WRITER_MAX_OUTPUT_TOKENS=2560
          # REVIEWER_MAX_OUTPUT_TOKENS=1024
          # GEMINI_TIMEOUT_SECONDS=180 | GEMINI_MAX_ATTEMPTS=3
          # GEMINI_CALL_BUDGET_SECONDS=240 | GEMINI_STRUCTURED_OUTPUT=1
          # BREAKER_WINDOW=5 | BREAKER_THRESHOLD=3 | RUN_BUDGET_SECONDS=2100
          # PUBLISH_ENABLED=1 | TELEGRAM_TIMEOUT_SECONDS=15
          # SITE_NEWS_DIR=data/news | SITE_TIMEOUT_SECONDS=20
          # SITE_STATS_SINCE=2026-01 | SITE_STATS_WORKFLOW=daily_news.yml
        run: python main.py

      - name: Upload Gemini quota ledger
        if: always() && steps.quota-restore.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: gemini-quota-ledger
          path: gemini-quota-ledger.json
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      - name: Upload run summary
        # Always upload so a failed run still leaves its business record behind.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-summary
          path: run-summary.json
          retention-days: 30
          if-no-files-found: warn
