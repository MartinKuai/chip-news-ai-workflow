name: Daily Chip News

on:
  schedule:
    # GitHub Actions cron is UTC: 22:55 UTC = 06:55 Asia/Shanghai (UTC+08:00) next day.
    - cron: "55 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chip-news-ai-workflow
  cancel-in-progress: false

jobs:
  run-micro-graph:
    runs-on: ubuntu-latest
    # Longer than RUN_BUDGET_SECONDS (2100s) so a bounded run always finishes
    # its summary and operational alert instead of being cancelled.
    timeout-minutes: 60
    # Keep workflow log timestamps aligned with the Beijing-time schedule.
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Writer -> Reviewer workflow
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL }}
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTICLES_PER_FEED: "2"
          MAX_REVISIONS: "1"
          # Optional tuning lives in the code defaults; set them here only when
          # a change is needed:
          # WRITER_THINKING_LEVEL=medium | REVIEWER_THINKING_LEVEL=low
          # WRITER_MAX_OUTPUT_TOKENS=16384 | REVIEWER_MAX_OUTPUT_TOKENS=8192
          # ARTICLE_CONTENT_CHARS=16000
          # GEMINI_TIMEOUT_SECONDS=180 | GEMINI_MAX_ATTEMPTS=5
          # GEMINI_CALL_BUDGET_SECONDS=240 | GEMINI_STRUCTURED_OUTPUT=1
          # GEMINI_HEALTH_WINDOW=5 | GEMINI_HEALTH_THRESHOLD=3
          # RUN_BUDGET_SECONDS=2100
        run: python main.py
